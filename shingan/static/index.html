<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShinGan Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>ShinGan</h1>
  <span class="subtitle">Nano Banana Pro Agent Dashboard</span>
  <nav>
    <button class="nav-btn active" data-tab="catalog">Catalog</button>
    <button class="nav-btn" data-tab="builder">Builder</button>
    <button class="nav-btn" data-tab="batch">Batch</button>
    <button class="nav-btn" data-tab="references">References</button>
    <button class="nav-btn" data-tab="history">History</button>
    <button class="nav-btn" data-tab="quiz">真贋クイズ</button>
  </nav>
</header>

<main>
  <!-- ====== Catalog Tab ====== -->
  <section id="tab-catalog" class="tab active">
    <div class="toolbar">
      <select id="cat-filter"><option value="">All</option></select>
      <span id="cat-count"></span>
    </div>
    <div id="prompt-grid" class="card-grid"></div>
  </section>

  <!-- ====== Builder Tab ====== -->
  <section id="tab-builder" class="tab">
    <div class="builder-form">
      <div class="field">
        <label>1. Subject</label>
        <input id="b-subject" placeholder="A cute pixel art mascot">
      </div>
      <div class="field">
        <label>2. Action</label>
        <input id="b-action" placeholder="running through a forest">
      </div>
      <div class="field">
        <label>3. Location</label>
        <input id="b-location" placeholder="a magical enchanted forest">
      </div>
      <div class="field">
        <label>4. Style</label>
        <select id="b-style"><option value="">--</option></select>
      </div>
      <div class="field">
        <label>5. Composition</label>
        <select id="b-composition"><option value="">--</option></select>
      </div>
      <div class="field">
        <label>6. Lighting</label>
        <select id="b-lighting"><option value="">--</option></select>
      </div>
      <div class="field">
        <label>7. Constraint</label>
        <input id="b-constraint" placeholder="Text: 'HELLO' visible on sign">
      </div>
      <div class="row">
        <div class="field">
          <label>Aspect Ratio</label>
          <select id="b-ar"><option value="">--</option></select>
        </div>
        <div class="field">
          <label>Resolution</label>
          <select id="b-res"><option value="">--</option></select>
        </div>
      </div>
      <button id="btn-compile" class="btn-primary">Compile Prompt</button>
      <div id="compiled-output" class="compiled-box hidden"></div>
      <button id="btn-generate-built" class="btn-primary hidden">Generate Request</button>
    </div>
  </section>

  <!-- ====== Batch Tab ====== -->
  <section id="tab-batch" class="tab">
    <div class="toolbar">
      <select id="batch-cat"><option value="">Category...</option></select>
      <input id="batch-count" type="number" placeholder="Count" min="1">
      <button id="btn-batch" class="btn-primary">Batch Generate</button>
    </div>
    <div id="batch-results"></div>
  </section>

  <!-- ====== References Tab ====== -->
  <section id="tab-references" class="tab">
    <div class="toolbar">
      <input id="ref-group" placeholder="Group name">
      <input id="ref-path" placeholder="Image path">
      <button id="btn-add-ref" class="btn-primary">Add</button>
    </div>
    <div id="ref-list"></div>
  </section>

  <!-- ====== History Tab ====== -->
  <section id="tab-history" class="tab">
    <div class="toolbar">
      <button id="btn-refresh-history" class="btn-primary">Refresh</button>
      <button id="btn-export-history">Export JSON</button>
    </div>
    <div id="history-list"></div>
  </section>

  <!-- ====== 真贋クイズ Tab ====== -->
  <section id="tab-quiz" class="tab">
    <!-- モード切替 -->
    <div class="toolbar">
      <button id="btn-quiz-create-mode" class="btn-primary">問題を作る</button>
      <button id="btn-quiz-list-mode">問題一覧</button>
      <button id="btn-quiz-play-mode">クイズに挑戦</button>
    </div>

    <!-- 作成モード -->
    <div id="quiz-create" class="quiz-panel">
      <h3>新しいクイズ問題を登録</h3>
      <div class="quiz-form">
        <div class="field">
          <label>作品名</label>
          <input id="quiz-title" type="text" placeholder="例: モナ・リザ">
        </div>
        <div class="quiz-upload-row">
          <div class="quiz-upload-col">
            <label>A欄（本物）</label>
            <div class="quiz-dropzone" id="quiz-real-zone">
              <span>クリックして画像を選択</span>
              <input type="file" id="quiz-real-file" accept="image/*">
            </div>
            <div id="quiz-real-preview" class="quiz-preview hidden"></div>
          </div>
          <div class="quiz-upload-col">
            <label>B欄（偽物）</label>
            <div class="quiz-dropzone" id="quiz-fake-zone">
              <span>クリックして画像を選択</span>
              <input type="file" id="quiz-fake-file" accept="image/*">
            </div>
            <div id="quiz-fake-preview" class="quiz-preview hidden"></div>
          </div>
        </div>
        <div class="field">
          <label>真贋ポイント（解説）</label>
          <textarea id="quiz-explanation" rows="3" placeholder="間違えた時に表示される解説を入力..."></textarea>
        </div>
        <button id="btn-quiz-submit" class="btn-primary">登録する</button>
      </div>
    </div>

    <!-- 問題一覧モード -->
    <div id="quiz-list" class="quiz-panel hidden">
      <h3>登録済みクイズ一覧</h3>
      <div id="quiz-list-items"></div>
    </div>

    <!-- 出題モード -->
    <div id="quiz-play" class="quiz-panel hidden">
      <div id="quiz-play-setup">
        <h3>連続出題モード</h3>
        <p id="quiz-play-count"></p>
        <button id="btn-quiz-start" class="btn-primary">スタート</button>
      </div>
      <div id="quiz-play-area" class="hidden">
        <div class="quiz-progress">
          <span id="quiz-progress-text"></span>
          <span id="quiz-score-text"></span>
        </div>
        <h3 id="quiz-play-title"></h3>
        <p class="quiz-question-label">どちらが本物？</p>
        <div class="quiz-play-images">
          <div class="quiz-play-card" id="quiz-left-card">
            <img id="quiz-left-img" src="" alt="左">
            <button id="btn-quiz-left" class="btn-primary">左が本物</button>
          </div>
          <div class="quiz-play-card" id="quiz-right-card">
            <img id="quiz-right-img" src="" alt="右">
            <button id="btn-quiz-right" class="btn-primary">右が本物</button>
          </div>
        </div>
        <div id="quiz-result-area" class="hidden">
          <div id="quiz-result-banner"></div>
          <div id="quiz-explanation-display" class="hidden"></div>
          <button id="btn-quiz-next" class="btn-primary">次の問題へ</button>
        </div>
      </div>
      <div id="quiz-final-result" class="hidden">
        <h3>結果発表</h3>
        <div id="quiz-final-score"></div>
        <div id="quiz-final-details"></div>
        <button id="btn-quiz-retry" class="btn-primary">もう一度</button>
      </div>
    </div>
  </section>
</main>

<!-- Attach modal -->
<div id="attach-modal" class="modal hidden">
  <div class="modal-content">
    <h3>Attach Image</h3>
    <p id="attach-id"></p>
    <input type="file" id="attach-file" accept="image/*">
    <div class="modal-actions">
      <button id="btn-attach-submit" class="btn-primary">Upload</button>
      <button id="btn-attach-cancel">Cancel</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
