[project]
name = "shingan"
version = "0.1.0"
description = "ShinGan - AI Image Agent powered by Nano Banana Pro (Gemini 3 Pro Image)"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.52.0",
    "Pillow>=10.0.0",
    "rich>=13.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
shingan = "shingan.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
